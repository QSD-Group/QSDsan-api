[project]
name = "waste-energy-api"
version = "2.0.0"
description = "High-performance API for waste-to-energy calculations"
requires-python = ">=3.10"
dependencies = [
    # Light-path runtime: health checks + county lookups (pandas/CSV only).
    # No biosteam/exposan/biorefineries/thermosteam/chaospy here — see the
    # "heavy" optional-dependency group below.
    "numpy==1.26.4",
    "pandas==2.2.3",
    # FastAPI stack for API modernization
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    # Additional utilities for modernization
    "python-multipart>=0.0.6",  # for form data handling
    "email-validator>=2.0.0",   # for email validation in FastAPI
    "psutil>=5.9.0",            # for system monitoring in health checks
]

[project.optional-dependencies]
# Heavy scientific stack, needed only by the three calc Lambdas
# (htl/combustion/fermentation). Their own transitive dependencies
# (numba, matplotlib, scipy, qsdsan, thermo, chemicals, SALib,
# scikit-learn, sympy, etc.) are resolved and locked automatically by
# `uv lock` — they don't need to be listed here explicitly.
heavy = [
    "biorefineries==2.31.0",
    "biosteam==2.46.1",
    "chaospy==4.3.17",
    "exposan==1.4.1",
    "thermosteam==0.45.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx>=0.25.0",  # for testing FastAPI endpoints
]
cache = [
    "redis>=5.0.0",
    "hiredis>=2.0.0",  # faster redis client
]
monitoring = [
    "prometheus-client>=0.17.0",
    "structlog>=23.0.0",
]
security = [
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx>=0.25.0",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]