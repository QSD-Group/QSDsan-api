name: Build, smoke-test, and push Lambda images to ECR

# Manual-dispatch only: builds/smoke-tests/pushes all four Lambda function
# images (light/htl/combustion/fermentation) on demand. See CLAUDE.md for
# the four-function architecture.
#
# Runs on GitHub's hosted runner (which already has Docker) instead of
# requiring a local Docker install, and smoke-tests each image (polls that
# function's own real endpoint until it returns 200) before ever pushing
# to ECR. Only light_app registers /health (see app/entrypoints/*.py) -
# htl/combustion/fermentation each only register their own calc router -
# so the readiness check polls each matrix entry's own smoke_path rather
# than a shared /health path.
#
# This does NOT validate the AWS Lambda Web Adapter's extension-proxy
# behavior: the standalone Lambda Runtime Interface Emulator does not
# support Lambda Extensions, so that path can only be exercised on real
# Lambda (see the AWS runbook's function-creation test-event steps).

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: nj-bioenergy-api

jobs:
  build-smoketest-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: light
            dockerfile: Dockerfile.lambda.light
            smoke_path: /api/v1/htl/county?county_name=Atlantic
          - name: htl
            dockerfile: Dockerfile.lambda.htl
            smoke_path: /api/v1/htl/calc?sludge=150
          - name: combustion
            dockerfile: Dockerfile.lambda.combustion
            smoke_path: /api/v1/combustion/calc?mass=1000&waste_type=sludge
          - name: fermentation
            dockerfile: Dockerfile.lambda.fermentation
            smoke_path: /api/v1/fermentation/calc?mass=100
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image
        run: docker build -f "${{ matrix.dockerfile }}" -t "nj-bioenergy-api:${{ matrix.name }}-smoketest" .

      - name: Smoke test ${{ matrix.name }} - poll its own endpoint until ready
        run: |
          # Deliberately no --rm here: if the container crashes or exits, we
          # need `docker logs` to still work afterward to see why. Cleaned
          # up explicitly at the end of this step instead.
          docker run -d -p 5000:5000 --name "${{ matrix.name }}-smoketest-app" "nj-bioenergy-api:${{ matrix.name }}-smoketest"

          # Poll the matrix entry's own real endpoint directly - not /health,
          # which only light_app registers. This doubles as both the
          # readiness check and the correctness check.
          echo "Waiting for ${{ matrix.smoke_path }} to return 200..."
          ready=""
          http_code="000"
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Running}}' "${{ matrix.name }}-smoketest-app" 2>/dev/null || echo "gone")
            if [ "$state" != "true" ]; then
              echo "Container is not running (state: $state) after $((i * 10))s - it exited/crashed."
              echo "--- docker inspect ---"
              docker inspect --format='{{json .State}}' "${{ matrix.name }}-smoketest-app" || true
              echo "--- docker logs ---"
              docker logs "${{ matrix.name }}-smoketest-app" || true
              exit 1
            fi
            http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" "http://localhost:5000${{ matrix.smoke_path }}" || echo "000")
            if [ "$http_code" = "200" ]; then
              ready="1"
              echo "Ready after $((i * 10))s"
              break
            fi
            sleep 10
          done
          if [ -z "$ready" ]; then
            echo "${{ matrix.smoke_path }} never returned 200 within 600s (last HTTP code: $http_code)"
            cat /tmp/response.json || true
            echo "--- docker logs ---"
            docker logs "${{ matrix.name }}-smoketest-app" || true
            exit 1
          fi

          echo "Response body:"
          cat /tmp/response.json

          docker stop "${{ matrix.name }}-smoketest-app"
          docker rm "${{ matrix.name }}-smoketest-app"

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push ${{ matrix.name }} image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker tag "nj-bioenergy-api:${{ matrix.name }}-smoketest" "$IMAGE:${{ matrix.name }}-${{ github.sha }}"
          docker tag "nj-bioenergy-api:${{ matrix.name }}-smoketest" "$IMAGE:${{ matrix.name }}-latest"
          docker push "$IMAGE:${{ matrix.name }}-${{ github.sha }}"
          docker push "$IMAGE:${{ matrix.name }}-latest"
          echo "Pushed $IMAGE:${{ matrix.name }}-latest and :${{ matrix.name }}-${{ github.sha }}"
