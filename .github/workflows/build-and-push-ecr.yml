name: Build and push image to ECR

# Builds the FastAPI backend image and pushes it to ECR in the qsdsan-app AWS account.
# App Runner is pointed at this ECR repo and (with auto-deploy on) redeploys on each new push.
#
# One-time setup required before this runs (see the redeploy plan, step 6a):
#   - An ECR repository named `nj-bioenergy-api` in the account/region below.
#   - A GitHub OIDC identity provider + an IAM role this repo may assume, with ECR push
#     permission. Store that role's ARN as the repo secret `AWS_GHA_ROLE_ARN`.

on:
  push:
    branches: [main]
    # Skip doc-only/test-only churn; rebuild only when app code or packaging changes.
    paths:
      - "app/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-and-push-ecr.yml"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  id-token: write   # required for OIDC federation with AWS
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: nj-bioenergy-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:latest and :${{ github.sha }}"
